<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- my css -->
    <link rel="stylesheet" href="./annunci.css">
</head>
<body>
    <nav class="navbar">
        <figure>
            <img src="./media/logo-black.png" alt="logo" class="img-navbar">
        </figure>
        
        <ul class="list-navbar">
            <li class="link-navbar">
                <a href="./index.html">Torna alla Home</a>
            </li>
            <li class="link-navbar">
                <a href="./chisiamo.html">Chi Siamo</a>
            </li>
        </ul>
        
        <div class="img-navbar">
            
        </div>
        
    </nav>
    
    
    <h1 class="text-yellow">Pagina degli Annunci</h1>
    
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-3 mt-5">
                <h3 class="text-yellow">Filtra per:</h3>
                <div class="accordion sticky-top" id="accordionExample">
                    <div class="accordion-item bg-black text-yellow">
                        <h2 class="accordion-header">
                            <button class="accordion-button bg-black text-yellow" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                Categoria
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div id="radioWrapper" class="accordion-body">

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="categories" id="All" checked>
                                    <label class="form-check-label" for="All">
                                        Tutte le Categorie
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item bg-black text-yellow">
                        <h2 class="accordion-header">
                            <button class="accordion-button bg-black text-yellow collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                Prezzo
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input id="inputPrezzi" type="range" class="w-100" value="500" min="0" max="1000">
                                <p class="lead" id="prezzoValue">0</p>

                            </div>
                        </div>
                    </div>
                    <div class="accordion-item bg-black text-yellow">
                        <h2 class="accordion-header">
                            <button class="accordion-button bg-black text-yellow collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                Parola
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input id="inputText" type="text">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="contenitore" class="col-12 col-md-9">
                
            </div>
        </div>
    </div>
</div>








<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- my js -->
<script src="./annunci.js"></script>
</body>
</html>
